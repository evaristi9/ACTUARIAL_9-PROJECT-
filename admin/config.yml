site_url: https://actuarial9.netlify.app
display_url: https://actuarial9.netlify.app

backend:
  name: git-gateway
  repo: evaristi9/ACTUARIAL_9-PROJECT-
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Project Title"
        name: "title"
        widget: "string"
      - label: "Description"
        name: "description"
        widget: "text"
      - label: "Project Image"
        name: "image"
        widget: "image"
      - label: "Project Link"
        name: "link"
        widget: "string"
      - label: "Project Category"
        name: "category"
        widget: "select"
        options:
          - label: "Insurance"
            value: "insurance"
          - label: "Statistics"
            value: "statistics"
          - label: "Programming"
            value: "programming"
        default: "programming"